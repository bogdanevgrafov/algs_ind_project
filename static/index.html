<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chicago Taxi Intelligence • Liquid Glass Edition</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --bg-core: #040814;
      --liquid-bg: rgba(14, 25, 48, 0.45);
      --liquid-border: rgba(255, 255, 255, 0.22);

      --neon-cyan: #22d3ee;
      --neon-pink: #f43f5e;
      --neon-yellow: #fbbf24;
      --neon-teal: #2dd4bf;
      --neon-blue: #38bdf8;
      --neon-frog: #10b981;

      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --font-ui: 'Plus Jakarta Sans', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-ui);
      background-color: var(--bg-core);
      color: var(--text-main);
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      padding-bottom: 80px;
    }

    /* Фоновая сетка */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: radial-gradient(circle at 50% 30%, black 40%, transparent 90%);
      pointer-events: none;
      z-index: 0;
    }

    /* Жидкие пятна Aurora Blobs */
    .liquid-blob {
      position: fixed;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.6;
      animation: morphBlob 16s ease-in-out infinite alternate;
    }

    .blob-1 {
      width: 520px;
      height: 480px;
      background: radial-gradient(circle, #06b6d4, #3b82f6);
      top: -100px;
      left: -80px;
    }

    .blob-2 {
      width: 560px;
      height: 520px;
      background: radial-gradient(circle, #a855f7, #ec4899);
      top: 30%;
      right: -150px;
      animation-delay: -6s;
    }

    .blob-3 {
      width: 440px;
      height: 440px;
      background: radial-gradient(circle, #fbbf24, #06b6d4);
      bottom: 2%;
      left: 20%;
      animation-delay: -11s;
      opacity: 0.35;
    }

    @keyframes morphBlob {
      0% {
        border-radius: 42% 58% 70% 30% / 45% 45% 55% 55%;
        transform: translate(0, 0) rotate(0deg);
      }
      50% {
        border-radius: 70% 30% 46% 54% / 30% 29% 71% 70%;
        transform: translate(50px, 35px) rotate(120deg) scale(1.1);
      }
      100% {
        border-radius: 38% 62% 63% 37% / 41% 44% 56% 59%;
        transform: translate(-30px, 60px) rotate(240deg) scale(0.95);
      }
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 1240px;
      margin: 0 auto;
      padding: 50px 24px 0;
    }

    /* Бейдж режима */
    .header-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 20px;
      background: rgba(251, 191, 36, 0.12);
      border: 1px solid rgba(251, 191, 36, 0.45);
      border-radius: 9999px;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--neon-yellow);
      box-shadow: 0 0 25px rgba(251, 191, 36, 0.25);
      margin-bottom: 18px;
      backdrop-filter: blur(14px);
      cursor: pointer;
      user-select: none;
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .header-badge:hover {
      transform: scale(1.06) rotate(-1.5deg);
      background: rgba(251, 191, 36, 0.22);
      box-shadow: 0 0 35px rgba(251, 191, 36, 0.5);
    }

    .header-badge:active { transform: scale(0.95); }

    .pulse-taxi {
      display: inline-block;
      animation: taxiWiggle 0.6s infinite alternate ease-in-out;
    }

    @keyframes taxiWiggle {
      from { transform: rotate(-8deg); }
      to { transform: rotate(8deg) translateY(-2px); }
    }

    h1 {
      font-size: clamp(2.3rem, 5.2vw, 3.8rem);
      font-weight: 900;
      letter-spacing: -0.035em;
      line-height: 1.08;
      background: linear-gradient(135deg, #ffffff 15%, #bae6fd 60%, #e0e7ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 1.05rem;
      margin-bottom: 38px;
    }

    /* Карточки Liquid Glass */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }

    .card {
      position: relative;
      background: var(--liquid-bg);
      backdrop-filter: blur(30px) saturate(210%) contrast(110%);
      -webkit-backdrop-filter: blur(30px) saturate(210%) contrast(110%);
      border: 1px solid var(--liquid-border);
      border-radius: 26px;
      padding: 26px 24px;
      overflow: hidden;
      cursor: pointer;
      box-shadow:
        inset 0 1.5px 2px rgba(255, 255, 255, 0.35),
        inset 0 -1.5px 2px rgba(0, 0, 0, 0.4),
        -4px -4px 18px rgba(34, 211, 238, 0.08),
        4px 4px 18px rgba(244, 63, 94, 0.08),
        0 20px 45px -12px rgba(2, 6, 23, 0.85);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .card:hover {
      border-color: rgba(255, 255, 255, 0.45);
      background: rgba(20, 36, 68, 0.65);
      box-shadow:
        inset 0 2px 4px rgba(255, 255, 255, 0.5),
        -6px -6px 25px rgba(34, 211, 238, 0.28),
        6px 6px 25px rgba(244, 63, 94, 0.25),
        0 28px 50px -10px rgba(0, 0, 0, 0.9);
      animation: jellyWobble 0.7s ease-in-out;
    }

    @keyframes jellyWobble {
      0% { transform: scale3d(1, 1, 1); }
      30% { transform: scale3d(1.07, 0.93, 1) translateY(-4px); }
      45% { transform: scale3d(0.95, 1.05, 1) translateY(-2px); }
      60% { transform: scale3d(1.03, 0.97, 1); }
      75% { transform: scale3d(0.98, 1.02, 1); }
      100% { transform: scale3d(1, 1, 1); }
    }

    .label {
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-weight: 800;
      color: var(--text-muted);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .label::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--neon-cyan);
      box-shadow: 0 0 10px var(--neon-cyan);
    }

    .value {
      font-family: var(--font-mono);
      font-size: clamp(1.85rem, 3.2vw, 2.6rem);
      font-weight: 700;
      letter-spacing: -0.04em;
      color: #ffffff;
      line-height: 1.1;
      text-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    /* Панели */
    .panel {
      position: relative;
      background: var(--liquid-bg);
      backdrop-filter: blur(32px) saturate(200%);
      -webkit-backdrop-filter: blur(32px) saturate(200%);
      border: 1px solid var(--liquid-border);
      border-radius: 28px;
      padding: 32px 30px;
      margin-top: 28px;
      box-shadow:
        inset 0 1.5px 2px rgba(255, 255, 255, 0.22),
        inset 0 -1px 2px rgba(0, 0, 0, 0.5),
        0 24px 50px -15px rgba(2, 6, 23, 0.9);
      transition: border-color 0.3s;
    }

    .panel:hover { border-color: rgba(255, 255, 255, 0.32); }

    .panel h2 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .panel h2::before {
      content: "🚕";
      font-size: 1.1rem;
      filter: drop-shadow(0 0 8px var(--neon-yellow));
    }

    form {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      align-items: flex-end;
    }

    label {
      display: flex;
      flex-direction: column;
      gap: 9px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-muted);
      min-width: 210px;
    }

    input {
      width: 100%;
      background: rgba(8, 15, 30, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 13px 18px;
      color: #ffffff;
      font-family: var(--font-mono);
      font-size: 0.92rem;
      outline: none;
      transition: all 0.25s ease;
      box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.5);
    }

    input:focus {
      background: rgba(11, 22, 44, 0.95);
      border-color: var(--neon-cyan);
      box-shadow:
        0 0 0 4px rgba(34, 211, 238, 0.18),
        0 0 20px rgba(34, 211, 238, 0.3);
      transform: translateY(-1px);
    }

    input[type="datetime-local"]::-webkit-calendar-picker-indicator {
      filter: invert(1) hue-rotate(180deg) brightness(1.2);
      cursor: pointer;
    }

    button {
      position: relative;
      background: linear-gradient(135deg, #06b6d4, #3b82f6, #ec4899);
      background-size: 200% 200%;
      color: #ffffff;
      border: none;
      border-radius: 16px;
      padding: 14px 26px;
      font-family: var(--font-ui);
      font-size: 0.88rem;
      font-weight: 800;
      cursor: pointer;
      overflow: hidden;
      box-shadow:
        inset 0 1px 1px rgba(255, 255, 255, 0.4),
        0 10px 25px -4px rgba(59, 130, 246, 0.55);
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    button:hover {
      transform: translateY(-2px) scale(1.02);
      background-position: 100% 100%;
      box-shadow: 0 14px 30px -4px rgba(236, 72, 153, 0.6);
    }

    button:active { transform: scale(0.92) !important; }

    button.secondary {
      background: rgba(30, 41, 59, 0.6);
      backdrop-filter: blur(12px);
      color: #f1f5f9;
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.15), 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    button.secondary:hover {
      background: rgba(45, 60, 88, 0.75);
      border-color: rgba(251, 191, 36, 0.5);
      box-shadow: 0 8px 22px rgba(251, 191, 36, 0.25);
    }

    .result-box:empty { display: none; }

    .result-box {
      margin-top: 22px;
      background: rgba(5, 10, 22, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 20px;
      animation: fadeInSlide 0.35s ease;
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.7);
    }

    @keyframes fadeInSlide {
      from { opacity: 0; transform: translateY(10px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .result-box p {
      font-size: 0.92rem;
      line-height: 1.6;
      color: var(--text-main);
      margin-bottom: 12px;
    }

    .result-box strong { color: var(--neon-cyan); font-weight: 700; }

    pre {
      margin: 12px 0 0;
      background: #02050f !important;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 18px;
      overflow-x: auto;
      color: #7dd3fc;
      font-family: var(--font-mono);
      font-size: 0.83rem;
      line-height: 1.65;
    }

    .drifting-taxi {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      font-size: 2.8rem;
      animation: driftAcross 1.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      filter: drop-shadow(0 15px 15px rgba(0,0,0,0.6));
    }

    @keyframes driftAcross {
      0% { left: -120px; bottom: 20%; transform: rotate(-15deg) scale(0.8); opacity: 1; }
      40% { transform: rotate(20deg) scale(1.3); }
      70% { transform: rotate(-10deg) scale(1.1); }
      100% { left: 110vw; bottom: 40%; transform: rotate(5deg) scale(1); opacity: 0; }
    }

    /* ============================================================
       ПАСХАЛКА: КНОПКА-ЛЯГУШКА (ЖИДКОЕ СТЕКЛО)
       ============================================================ */
    .frog-easter-egg {
      position: fixed;
      bottom: 28px;
      right: 28px;
      z-index: 999;
      width: 66px;
      height: 66px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, rgba(16, 185, 129, 0.45), rgba(6, 78, 59, 0.7));
      backdrop-filter: blur(20px) saturate(220%);
      -webkit-backdrop-filter: blur(20px) saturate(220%);
      border: 1.5px solid rgba(167, 243, 208, 0.45);
      box-shadow:
        inset 0 2px 3px rgba(255, 255, 255, 0.6),
        inset 0 -2px 4px rgba(0, 0, 0, 0.5),
        0 12px 30px rgba(16, 185, 129, 0.4),
        0 0 20px rgba(5, 150, 105, 0.3);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      animation: frogFloat 4s ease-in-out infinite alternate;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes frogFloat {
      0% {
        transform: translateY(0) rotate(0deg);
        border-radius: 50% 50% 48% 52% / 52% 48% 52% 48%;
      }
      50% {
        transform: translateY(-8px) rotate(4deg);
        border-radius: 46% 54% 52% 48% / 54% 46% 54% 46%;
      }
      100% {
        transform: translateY(3px) rotate(-3deg);
        border-radius: 54% 46% 48% 52% / 48% 52% 48% 52%;
      }
    }

    .frog-emoji {
      font-size: 2.1rem;
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.4));
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.4);
      pointer-events: none;
    }

    .frog-easter-egg:hover {
      transform: scale(1.18) translateY(-4px);
      box-shadow:
        inset 0 3px 5px rgba(255, 255, 255, 0.8),
        0 18px 40px rgba(16, 185, 129, 0.65),
        0 0 30px rgba(52, 211, 153, 0.5);
      border-color: rgba(255, 255, 255, 0.8);
    }

    .frog-easter-egg:hover .frog-emoji {
      transform: scale(1.25) rotate(-8deg);
    }

    .frog-ribbiting {
      animation: throatRibbit 0.32s cubic-bezier(0.36, 0.07, 0.19, 0.97) !important;
    }

    @keyframes throatRibbit {
      0% { transform: scale(1); }
      35% { transform: scale(1.38, 0.72) translateY(5px); }
      65% { transform: scale(0.85, 1.3) translateY(-8px); }
      100% { transform: scale(1); }
    }

    .frog-speech-bubble {
      position: fixed;
      pointer-events: none;
      z-index: 1000;
      background: rgba(6, 78, 59, 0.92);
      border: 1px solid rgba(110, 231, 183, 0.5);
      color: #6ee7b7;
      font-family: var(--font-mono);
      font-size: 0.82rem;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 12px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5), 0 0 15px rgba(16, 185, 129, 0.4);
      backdrop-filter: blur(10px);
      animation: floatCroak 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes floatCroak {
      0% {
        opacity: 0;
        transform: translateY(0) scale(0.6) rotate(-10deg);
      }
      25% {
        opacity: 1;
        transform: translateY(-20px) scale(1.15) rotate(5deg);
      }
      100% {
        opacity: 0;
        transform: translateY(-60px) scale(0.9) rotate(-5deg);
      }
    }

    .chart-wrap { max-width: 100%; min-height: 350px; }
    canvas#hoursChart { width: 100% !important; max-height: 360px; margin-top: 10px; }

    @media (max-width: 768px) {
      .container { padding: 32px 16px 0; }
      .panel { padding: 24px 18px; }
      form { flex-direction: column; align-items: stretch; }
      label { min-width: 100%; }
      button { width: 100%; }
      .frog-easter-egg { bottom: 18px; right: 18px; width: 58px; height: 58px; }
      .frog-emoji { font-size: 1.8rem; }
    }
  </style>
</head>
<body>
  <div class="liquid-blob blob-1"></div>
  <div class="liquid-blob blob-2"></div>
  <div class="liquid-blob blob-3"></div>

  <div class="container">
    <div class="header-badge" id="taxi-status-btn" title="Нажми для смены водительской мудрости!">
      <span class="pulse-taxi">🚕</span>
      <span id="taxi-quote">РЕЖИМ БОМБИЛЫ • ДОРОГУ ПОКАЖЕШЬ?</span>
    </div>

    <h1>Taxi Trips Explorer</h1>
    <div class="subtitle">Интеллектуальный анализ поездок такси в жидком стекле</div>

    <section class="grid" id="summary-cards"></section>

    <div class="panel chart-wrap">
      <h2>Количество поездок по часам</h2>
      <canvas id="hoursChart"></canvas>
    </div>

    <div class="panel">
      <h2>Поиск поездки по trip_id</h2>
      <form id="trip-search-form">
        <label>
          trip_id
          <input id="trip-id" name="trip_id" placeholder="Напр: 0000a941e7..." autocomplete="off" />
        </label>
        <button type="submit">Найти поездку</button>
        <button type="button" class="secondary" id="index-stats-btn">Статистика индекса</button>
      </form>
      <div id="trip-result" class="result-box"></div>
      <div id="index-stats" class="result-box"></div>
    </div>

    <div class="panel">
      <h2>Статистика за период</h2>
      <form id="range-form">
        <label>
          От
          <input type="datetime-local" id="from-time" />
        </label>
        <label>
          До
          <input type="datetime-local" id="to-time" />
        </label>
        <button type="submit">Посчитать период</button>
      </form>
      <div id="range-result" class="result-box"></div>
    </div>
  </div>

  <!-- КНОПКА-ЛЯГУШКА -->
  <button type="button" class="frog-easter-egg" id="frog-btn" title="Секретная лягушка (КВАКНИ!)">
    <span class="frog-emoji">🐸</span>
  </button>

  <script>
    const FROG_AUDIO_SRC = '/static/frog.mp3';

    // Создаем аудиоплеер из файла
    const frogAudio = new Audio(FROG_AUDIO_SRC);

    // Запасная публичная ссылка на кваканье (если локального frog.mp3 нет)
    const FROG_FALLBACK_URL = 'https://upload.wikimedia.org/wikipedia/commons/transcoded/2/23/Single_Frog_Croak.oga/Single_Frog_Croak.oga.mp3';

    const frogBtn = document.getElementById('frog-btn');
    const frogPhrases = ["КВА! 🫧", "RIB-BIT! 🪷", "КУСЬ ЗА ПЯТКУ!", "КВА-АК!", "С ТЕБЯ 500 РУБЛЕЙ 🚖", "ШЛЁП-ШЛЁП!"];

    frogBtn.addEventListener('click', (e) => {
      e.stopPropagation();

      // Воспроизведение звука из файла
      frogAudio.currentTime = 0;
      frogAudio.play().catch(() => {
        // Если локальный файл frog.mp3 не найден, пробуем загрузить резервный звук
        frogAudio.src = FROG_FALLBACK_URL;
        frogAudio.play().catch(err => console.warn('Не удалось воспроизвести звук:', err));
      });

      // Анимация раздувания зобы
      frogBtn.classList.remove('frog-ribbiting');
      void frogBtn.offsetWidth;
      frogBtn.classList.add('frog-ribbiting');

      // Облачко со словом
      const rect = frogBtn.getBoundingClientRect();
      const bubble = document.createElement('div');
      bubble.className = 'frog-speech-bubble';
      bubble.textContent = frogPhrases[Math.floor(Math.random() * frogPhrases.length)];
      bubble.style.left = (rect.left - 50) + 'px';
      bubble.style.top = (rect.top - 20) + 'px';
      document.body.appendChild(bubble);

      setTimeout(() => bubble.remove(), 1200);
    });

    /* ============================================================
       КЛАКСОН ТАКСИ И ДРИФТ
       ============================================================ */
    function honkTaxiHorn() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc1 = ctx.createOscillator();
        const osc2 = ctx.createOscillator();
        const gain = ctx.createGain();

        osc1.type = 'triangle';
        osc2.type = 'sawtooth';
        osc1.frequency.setValueAtTime(420, ctx.currentTime);
        osc2.frequency.setValueAtTime(510, ctx.currentTime);
        gain.gain.setValueAtTime(0.12, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.28);

        osc1.connect(gain);
        osc2.connect(gain);
        gain.connect(ctx.destination);
        osc1.start(); osc2.start();
        osc1.stop(ctx.currentTime + 0.28); osc2.stop(ctx.currentTime + 0.28);
      } catch (e) {}
    }

    function spawnDriftTaxi() {
      honkTaxiHorn();
      const taxi = document.createElement('div');
      taxi.className = 'drifting-taxi';
      taxi.innerHTML = '🚕💨💨';
      taxi.style.bottom = Math.floor(Math.random() * 50 + 20) + '%';
      document.body.appendChild(taxi);
      setTimeout(() => taxi.remove(), 1600);
    }

    document.addEventListener('click', (e) => {
      if (e.target.closest('#frog-btn')) return;
      if (e.target.tagName === 'BUTTON') {
        spawnDriftTaxi();
      }
    });

    const taxiQuotes = [
      "РЕЖИМ БОМБИЛЫ • ДОРОГУ ПОКАЖЕШЬ?",
      "ПЕРЕВОДОМ НА СБЕР • БЕЗ СДАЧИ",
      "БРАТ, МУЗЫКУ ПОГРОМЧЕ СДЕЛАТЬ?",
      "СЧЁТЧИК ВКЛЮЧЁН • ДВА СЧЁТЧИКА!",
      "ЧЕК ГОРИТ, НО МАШИНА ЗВЕРЬ 🐆",
      "Я ВООБЩЕ ДЛЯ ДУШИ ТАКСУЮ, ТАК-ТО БИЗНЕС ЕСТЬ"
    ];
    let quoteIdx = 0;
    document.getElementById('taxi-status-btn').addEventListener('click', () => {
      quoteIdx = (quoteIdx + 1) % taxiQuotes.length;
      document.getElementById('taxi-quote').textContent = taxiQuotes[quoteIdx];
      honkTaxiHorn();
    });

    /* ============================================================
       API И СТАТИСТИКА
       ============================================================ */
    async function fetchJson(url) {
      const response = await fetch(url);
      if (!response.ok) {
        const text = await response.text();
        throw new Error(text || 'Ошибка запроса');
      }
      return await response.json();
    }

    function renderCards(cards) {
      const container = document.getElementById('summary-cards');
      const entries = [
        ['Поездки', Number(cards.trips).toLocaleString('ru-RU')],
        ['Выручка', '$' + Number(cards.revenue).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })],
        ['Средний тариф', '$' + Number(cards.avg_fare).toFixed(2)],
        ['Средний пробег', Number(cards.avg_miles).toFixed(2) + ' mi'],
      ];
      container.innerHTML = entries.map(([label, value]) => `
        <div class="card" onclick="honkTaxiHorn()">
          <div class="label">${label}</div>
          <div class="value">${value}</div>
        </div>
      `).join('');
    }

    function renderHoursChart(data) {
      const ctx = document.getElementById('hoursChart');
      if (window.hoursChartInstance) {
        window.hoursChartInstance.destroy();
      }

      const chartCanvas = ctx.getContext('2d');
      const gradient = chartCanvas.createLinearGradient(0, 0, 0, 320);
      gradient.addColorStop(0, '#22d3ee');
      gradient.addColorStop(0.5, '#3b82f6');
      gradient.addColorStop(1, 'rgba(236, 72, 153, 0.15)');

      window.hoursChartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: data.labels,
          datasets: [{
            label: 'Поездки',
            data: data.values,
            backgroundColor: gradient,
            hoverBackgroundColor: '#fbbf24',
            borderRadius: 10,
            borderSkipped: false,
            barPercentage: 0.72
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: 'rgba(4, 8, 20, 0.95)',
              titleFont: { family: 'Plus Jakarta Sans', size: 13, weight: '700' },
              bodyFont: { family: 'JetBrains Mono', size: 13 },
              borderColor: 'rgba(34, 211, 238, 0.4)',
              borderWidth: 1,
              padding: 14,
              boxPadding: 6,
              cornerRadius: 14,
              displayColors: false,
              callbacks: {
                label: (context) => `🚖 Поездок: ${Number(context.raw).toLocaleString('ru-RU')}`
              }
            }
          },
          scales: {
            x: {
              grid: { display: false },
              ticks: { color: '#64748b', font: { family: 'JetBrains Mono', size: 11 } }
            },
            y: {
              beginAtZero: true,
              grid: { color: 'rgba(255, 255, 255, 0.05)', drawBorder: false },
              ticks: {
                color: '#64748b',
                font: { family: 'JetBrains Mono', size: 11 },
                callback: (val) => val >= 1000 ? (val / 1000) + 'k' : val
              }
            }
          }
        }
      });
    }

    async function loadSummary() {
      try {
        const response = await fetchJson('/api/summary');
        renderCards(response.cards);
        renderHoursChart(response.hours);
      } catch (err) {
        console.warn('API /api/summary недоступен в демо-режиме:', err.message);
      }
    }

    document.getElementById('trip-search-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const tripId = document.getElementById('trip-id').value.trim();
      if (!tripId) {
        document.getElementById('trip-result').innerHTML = '<p>Введите trip_id</p>';
        return;
      }
      try {
        const result = await fetchJson(`/api/trip/${encodeURIComponent(tripId)}`);
        document.getElementById('trip-result').innerHTML = `
          <p><strong>⚡ Скорость поиска:</strong> хеш-таблица ${result.time_ms.hashmap.toFixed(3)} ms, линейный ${result.time_ms.linear.toFixed(3)} ms</p>
          <pre>${JSON.stringify(result.trip, null, 2)}</pre>
        `;
      } catch (error) {
        document.getElementById('trip-result').innerHTML = `<p>${error.message}</p>`;
      }
    });

    document.getElementById('index-stats-btn').addEventListener('click', async () => {
      try {
        const stats = await fetchJson('/api/index-stats');
        document.getElementById('index-stats').innerHTML = `<pre>${JSON.stringify(stats, null, 2)}</pre>`;
      } catch (error) {
        document.getElementById('index-stats').innerHTML = `<p>${error.message}</p>`;
      }
    });

    document.getElementById('range-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const fromValue = document.getElementById('from-time').value;
      const toValue = document.getElementById('to-time').value;
      if (!fromValue || !toValue) {
        document.getElementById('range-result').innerHTML = '<p>Укажите оба значения времени</p>';
        return;
      }
      try {
        const result = await fetchJson(`/api/range?from=${encodeURIComponent(fromValue)}&to=${encodeURIComponent(toValue)}`);
        document.getElementById('range-result').innerHTML = `
          <p><strong>Период:</strong> ${result.from} → ${result.to}</p>
          <p><strong>Время:</strong> дерево ${result.time_ms.tree.toFixed(3)} ms, обычный ${result.time_ms.common.toFixed(3)} ms</p>
          <p><strong>Дерево:</strong> ${JSON.stringify(result.tree)}</p>
          <p><strong>Обычный:</strong> ${JSON.stringify(result.common)}</p>
        `;
      } catch (error) {
        document.getElementById('range-result').innerHTML = `<p>${error.message}</p>`;
      }
    });

    loadSummary();
  </script>
</body>
</html>
